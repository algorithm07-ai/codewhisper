version: '3'

services:
  app:
    container_name: instantcoder-container
    build:
      context: .
      dockerfile: Dockerfile
      target: dev # 使用dev阶段专门为开发环境配置
    volumes:
      - .:/app
      - /app/node_modules # 使用容器内的node_modules
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    restart: unless-stopped
